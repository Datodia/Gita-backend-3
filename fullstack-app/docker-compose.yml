services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # no public port: only reachable inside app-network
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017/app}
    # no public port: nginx (frontend) proxies /api -> backend:3000
    expose:
      - 3000
    networks:
      - app-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - 80:80
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
